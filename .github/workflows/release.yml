name: Release and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '26'
  VERCEL_CLI_VERSION: '67.0.0'

jobs:
  check:
    name: Test merged commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: node --test *.test.mjs
      - run: node build.mjs

  release:
    name: Publish GitHub release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Publish a release for the tested commit
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.$GITHUB_RUN_NUMBER"
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          existing_ref="$(git ls-remote --refs --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag")"
          previous_sha="${existing_ref%%$'\t'*}"
          if [[ -n "$previous_sha" && "$previous_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag $tag already points to a different commit."
            exit 1
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Mekaneed $tag" --generate-notes
          fi
          release_sha="$(gh api "$ref" --jq '.object.sha')"
          if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag $tag does not point to the tested commit."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy release to Vercel
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: mekaneed-production
      queue: max
    environment:
      name: production
      url: https://mekaneed-app.vercel.app/
    steps:
      - name: Check the release against production
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="$RUNNER_TEMP/mekaneed-live-release.json"
          status="$(curl --silent --show-error --retry 3 --max-time 30 \
            -H 'Cache-Control: no-cache' -o "$marker" -w '%{http_code}' \
            'https://mekaneed-app.vercel.app/release.json')"
          if [[ "$status" == 200 ]]; then
            live_sha="$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' "$marker")"
            relationship="$(gh api "repos/$GITHUB_REPOSITORY/compare/$live_sha...$GITHUB_SHA" --jq .status)"
            case "$relationship" in
              behind)
                echo "::notice::Production already serves a newer commit. This release was not deployed."
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              ahead|identical) ;;
              *)
                echo "::error::This release and the live commit have diverged."
                exit 1
                ;;
            esac
          elif [[ "$status" != 404 ]]; then
            echo "::error::Could not check the current production release (HTTP $status)."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install the pinned Vercel CLI
        if: steps.current.outputs.deploy == 'true'
        run: npm install --global --no-audit --no-fund "vercel@$VERCEL_CLI_VERSION"
      - name: Build and deploy the released commit
        if: steps.current.outputs.deploy == 'true'
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Set VERCEL_TOKEN in the production environment and the two Vercel project variables."
            exit 1
          fi
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          jq -n --arg commit "$GITHUB_SHA" --arg tag "$RELEASE_TAG" '{commit: $commit, tag: $tag}' \
            > .vercel/output/static/release.json
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" \
            --meta "releaseTag=$RELEASE_TAG" --meta "sourceCommit=$GITHUB_SHA"
      - name: Verify the public site matches the release
        if: steps.current.outputs.deploy == 'true'
        run: |
          for expected in dist/* .vercel/output/static/release.json; do
            asset="${expected##*/}"
            curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
              "https://mekaneed-app.vercel.app/$asset" -o "$RUNNER_TEMP/mekaneed-$asset"
            cmp "$expected" "$RUNNER_TEMP/mekaneed-$asset"
          done
